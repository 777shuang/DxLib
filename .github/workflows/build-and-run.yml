name: Build and Run Nim Project

on:
  push:

permissions:
  contents: write

jobs:
  build-and-run:
    name: Build and run on Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Install dependencies
        run: nimble install -y

      - name: Build project
        run: nimble build -y

      - name: Run DxLibHeaderSpliter
        run: nimble run DxLibHeaderSpliter

      - name: Commit and push generated changes
        shell: pwsh
        run: |
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No generated changes to commit."
          } else {
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update generated DxLib bindings"
            git push
          }
